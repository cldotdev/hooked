services:
  hooked:
    image: ghcr.io/cldotdev/hooked:latest
    restart: unless-stopped
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env to the host docker group ID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.srv/hooked/:/app/
      # - /path/to/repo/:/path/to/repo/
    expose:
      - 3000
    environment:
      - LOG_FILE_PATH=log/app.log
      - HOOKED_HOST=0.0.0.0
      - HOOKED_PORT=3000
      - BUILD_ENTRY_SCRIPT_PATH=./build.sh
      - WEBHOOK_SECRET=/run/secrets/webhook_secret
      - WATCH_PUSH_BRANCH=
      - GIT_HOST=github.com
      # - GIT_URL=https://git.example.com
      # - GIT_SSH_HOST=git-ssh.example.com
      - DISCORD_WEBHOOK_URL=/run/secrets/discord_webhook_url
    secrets:
      - webhook_secret
      - git_token
      - discord_webhook_url
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/cf_tunnel_token
    secrets:
      - cf_tunnel_token

secrets:
  webhook_secret:
    file: ./.secrets/webhook_secret
  git_token:
    file: ./.secrets/git_token
  discord_webhook_url:
    file: ./.secrets/discord_webhook_url
  cf_tunnel_token:
    file: ./.secrets/cf_tunnel_token
