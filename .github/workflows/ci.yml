---
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile is the single place that names the Rust version, so a
      # lint added in a newer stable release cannot break CI before it moves.
      - name: Install the Rust toolchain from the Dockerfile
        run: |
          version="$(sed -n 's/^FROM rust:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal \
            --component clippy,rustfmt
          rustup default "$version"

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
