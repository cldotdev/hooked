---
name: Release

# Tags are unprefixed, and all three components are anchored so that a
# prerelease tag such as 1.0.5-rc1 does not ship a release.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish image and release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the Cargo.toml version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # Only the highest version takes `latest`, for the image and the
      # release alike. Otherwise tags pushed together race for it, and a fix
      # released for an older line would take it from a newer one.
      - name: Check whether the tag is the highest version
        id: latest
        run: |
          highest="$(git ls-remote --tags --refs origin \
            | sed -n 's|.*refs/tags/\([0-9]\+\.[0-9]\+\.[0-9]\+\)$|\1|p' \
            | sort -V | tail -n 1)"
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels carry org.opencontainers.image.source, which is what links
      # the GHCR package back to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
          flavor: latest=${{ steps.latest.outputs.value }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # actions/checkout maps the pushed commit straight onto refs/tags,
      # leaving a lightweight tag that carries no annotation. --notes-from-tag
      # reads the local tag and falls back to the commit message when the
      # annotation is missing, so the release notes depend on this fetch.
      # --title keeps the release named after the tag alone: left unset, GitHub
      # titles it with the tag and the annotation's first line, which the notes
      # already open with.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.latest.outputs.value }}
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --notes-from-tag --title "$GITHUB_REF_NAME" --latest="$LATEST"
