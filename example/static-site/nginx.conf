server {
    listen 80;
    root /srv/site/current;
    index index.html;
    error_page 404 /404.html;

    server_tokens off;
    absolute_redirect off;
    add_header_inherit merge;

    # The peer is the tunnel container on a Docker network (Docker's default address pools).
    real_ip_header   CF-Connecting-IP;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types      text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Asset names are not fingerprinted in a generic Hugo site, so only HTML
    # is revalidated on every request. A request for a directory reaches this
    # location through the internal redirect to its index.html.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }
}
